name: authoring-source-release-contract

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Validate tracked Release-first contract
        run: node --test scripts/authoring-release.test.mjs
      - name: Explain the manual immutable publication boundary
        run: echo "Large authoring bytes are prepared and published only through the reviewed local BAT entrypoints."
